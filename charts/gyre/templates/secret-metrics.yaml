{{- $metricsSecretName := include "gyre.metricsSecretName" . -}}
{{- $existingMetricsSecret := lookup "v1" "Secret" .Release.Namespace $metricsSecretName -}}
{{- $existingMetricsAnnotations := dict -}}
{{- $existingMetricsData := dict -}}
{{- if $existingMetricsSecret -}}
{{- $existingMetricsAnnotations = default (dict) $existingMetricsSecret.metadata.annotations -}}
{{- $existingMetricsData = default (dict) $existingMetricsSecret.data -}}
{{- end -}}
{{- $existingMetricsGenerated := and $existingMetricsSecret (eq (default "" (get $existingMetricsAnnotations "gyre.io/generated")) "true") -}}
{{- if $existingMetricsGenerated -}}
{{- if not (hasKey $existingMetricsData "GYRE_METRICS_TOKEN") -}}
{{- fail (printf "Generated metrics Secret %s is missing required key GYRE_METRICS_TOKEN." $metricsSecretName) -}}
{{- end -}}
{{- end -}}
{{- if or (and .Values.metrics.autoGenerate (not $existingMetricsSecret)) $existingMetricsGenerated -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $metricsSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Retain this Secret on helm uninstall so monitoring credentials remain stable.
    # Delete manually when you are certain the token is no longer needed.
    helm.sh/resource-policy: keep
    gyre.io/generated: "true"
  labels:
    {{- include "gyre.labels" . | nindent 4 }}
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  {{- if $existingMetricsGenerated }}
  {{- toYaml $existingMetricsData | nindent 2 }}
  {{- else }}
  GYRE_METRICS_TOKEN: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
{{- end }}
