{{- $encryptionSecretName := include "gyre.encryptionSecretName" . -}}
{{- $existingEncryptionSecret := lookup "v1" "Secret" .Release.Namespace $encryptionSecretName -}}
{{- $existingEncryptionAnnotations := dict -}}
{{- $existingEncryptionData := dict -}}
{{- if $existingEncryptionSecret -}}
{{- $existingEncryptionAnnotations = default (dict) $existingEncryptionSecret.metadata.annotations -}}
{{- $existingEncryptionData = default (dict) $existingEncryptionSecret.data -}}
{{- end -}}
{{- $existingEncryptionGenerated := and $existingEncryptionSecret (eq (default "" (get $existingEncryptionAnnotations "gyre.io/generated")) "true") -}}
{{- $inlineEncryptionConfigured := and (not .Values.encryption.existingSecret) .Values.encryption.allowInline (and .Values.encryption.gyreKey .Values.encryption.authKey .Values.encryption.backupKey .Values.encryption.betterAuthSecret) -}}
{{- if $existingEncryptionGenerated -}}
{{- range $key := (list "GYRE_ENCRYPTION_KEY" "AUTH_ENCRYPTION_KEY" "BACKUP_ENCRYPTION_KEY" "BETTER_AUTH_SECRET") -}}
{{- if not (hasKey $existingEncryptionData $key) -}}
{{- fail (printf "Generated encryption Secret %s is missing required key %s." $encryptionSecretName $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if or $inlineEncryptionConfigured (and .Values.encryption.autoGenerate (not $existingEncryptionSecret)) $existingEncryptionGenerated -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $encryptionSecretName }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Retain this Secret on helm uninstall to prevent losing encryption keys.
    # Delete manually when you are certain the keys are no longer needed.
    helm.sh/resource-policy: keep
    gyre.io/generated: "true"
  labels:
    {{- include "gyre.labels" . | nindent 4 }}
    app.kubernetes.io/component: security
type: Opaque
data:
  {{- if $existingEncryptionGenerated }}
  {{- toYaml $existingEncryptionData | nindent 2 }}
  {{- else }}
  {{- if .Values.encryption.gyreKey }}
  GYRE_ENCRYPTION_KEY: {{ .Values.encryption.gyreKey | b64enc | quote }}
  {{- else }}
  GYRE_ENCRYPTION_KEY: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- end }}
  {{- if .Values.encryption.authKey }}
  AUTH_ENCRYPTION_KEY: {{ .Values.encryption.authKey | b64enc | quote }}
  {{- else }}
  AUTH_ENCRYPTION_KEY: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- end }}
  {{- if .Values.encryption.backupKey }}
  BACKUP_ENCRYPTION_KEY: {{ .Values.encryption.backupKey | b64enc | quote }}
  {{- else }}
  BACKUP_ENCRYPTION_KEY: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- end }}
  {{- if .Values.encryption.betterAuthSecret }}
  BETTER_AUTH_SECRET: {{ .Values.encryption.betterAuthSecret | b64enc | quote }}
  {{- else }}
  BETTER_AUTH_SECRET: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
