name: Create Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      platforms:
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && inputs.tag == github.ref_name
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'v4.3.0'

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish chart then create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          IMAGE_PLATFORMS: ${{ inputs.platforms }}
        run: bash scripts/publish-release.sh "$RELEASE_TAG" "$IMAGE_DIGEST" "$IMAGE_PLATFORMS"
