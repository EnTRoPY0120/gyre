name: Lint and Type-Check

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:

# Keep only the newest verification run for a branch or pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js, pnpm, and pnpm cache
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26.10.0
          install: false
          cache: true

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: 'v4.3.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run verification gate (CI parity)
        run: pnpm verify:repo:ci
