name: Build and Publish Docker Image

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths-ignore: ['documentation/**', '**.md']
  pull_request:
    paths-ignore: ['documentation/**', '**.md']
  workflow_dispatch:
    inputs:
      verification_only:
        description: Build, scan, and smoke-test both architectures without publishing
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: entropy0120/gyre
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.image-artifact.outputs.artifact-id }}
      archive-sha256: ${{ steps.archive.outputs.sha256 }}
      digest: ${{ steps.archive.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
      platforms: ${{ steps.platforms.outputs.value }}
      sarif-artifact-id: ${{ steps.sarif-artifact.outputs.artifact-id }}
      sarif-uploaded: ${{ steps.sarif-artifact.outputs.artifact-id != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select platforms
        id: platforms
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "${{ inputs.verification_only }}" != true ]; then
            echo 'value=linux/amd64' >> "$GITHUB_OUTPUT"
          else
            echo 'value=linux/amd64,linux/arm64' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=ref,event=pr
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Gyre
            org.opencontainers.image.description=Modern WebUI for FluxCD
            org.opencontainers.image.vendor=Gyre Project
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Gyre
            org.opencontainers.image.description=Modern WebUI for FluxCD
            org.opencontainers.image.vendor=Gyre Project
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      - name: Build original OCI image archive
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ steps.platforms.outputs.value }}
          outputs: type=oci,dest=${{ runner.temp }}/gyre-image.tar,oci-artifact=false
          # A single archive reference lets Skopeo consume the OCI index reliably.
          tags: gyre:verified
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha
            type=gha,scope=arm64
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Verify archive digest and calculate checksum
        id: archive
        env:
          BUILT_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BUILT_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          digest="sha256:$(skopeo inspect --raw "oci-archive:${{ runner.temp }}/gyre-image.tar" | sha256sum | cut -d' ' -f1)"
          test "$digest" = "$BUILT_DIGEST"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "${{ runner.temp }}/gyre-image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Import amd64 image for scanning
        run: skopeo copy --override-os linux --override-arch amd64 "oci-archive:${{ runner.temp }}/gyre-image.tar" docker-daemon:gyre:scan-amd64

      - name: Run Trivy scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: gyre:scan-amd64
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Import arm64 image for scanning
        if: contains(steps.platforms.outputs.value, 'arm64')
        run: skopeo copy --override-os linux --override-arch arm64 "oci-archive:${{ runner.temp }}/gyre-image.tar" docker-daemon:gyre:scan-arm64

      - name: Run Trivy scan arm64 (blocking)
        if: contains(steps.platforms.outputs.value, 'arm64')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: gyre:scan-arm64
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Run Trivy SARIF scan
        id: sarif
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: gyre:scan-arm64
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln,secret,config
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Upload Trivy SARIF artifact
        id: sarif-artifact
        if: github.event_name != 'pull_request' && inputs.verification_only != true && steps.sarif.outcome == 'success' && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-sarif-${{ github.run_id }}-${{ github.run_attempt }}
          path: trivy-results.sarif
          if-no-files-found: error
          retention-days: 2

      - name: Record OCI artifact identity
        env:
          IMAGE_DIGEST: ${{ steps.archive.outputs.digest }}
          ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          {
            echo '## Scanned OCI artifact'
            echo
            echo "- Root digest: \`$IMAGE_DIGEST\`"
            echo "- Archive SHA-256: \`$ARCHIVE_SHA256\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload original OCI artifact
        id: image-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gyre-oci-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gyre-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  build-and-push:
    # Keep this required check green only when both untrusted-code jobs succeeded.
    if: always()
    needs: [build-image, smoke, publish]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Require image build and smoke success
        env:
          BUILD_RESULT: ${{ needs.build-image.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$SMOKE_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ] || [ "${{ inputs.verification_only }}" = true ]; then
            test "$PUBLISH_RESULT" = skipped
          else
            test "$PUBLISH_RESULT" = success
          fi

  smoke:
    needs: build-image
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download exact original OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/image
          digest-mismatch: error

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Verify OCI artifact identity
        env:
          EXPECTED_SHA256: ${{ needs.build-image.outputs.archive-sha256 }}
          EXPECTED_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "$EXPECTED_SHA256  ${{ runner.temp }}/image/gyre-image.tar" | sha256sum --check --status
          digest="sha256:$(skopeo inspect --raw "oci-archive:${{ runner.temp }}/image/gyre-image.tar" | sha256sum | cut -d' ' -f1)"
          test "$digest" = "$EXPECTED_DIGEST"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Load smoke images
        run: |
          set -euo pipefail
          skopeo copy --override-os linux --override-arch amd64 "oci-archive:${{ runner.temp }}/image/gyre-image.tar" docker-daemon:gyre:scan-amd64
          if [[ "${{ needs.build-image.outputs.platforms }}" == *arm64* ]]; then
            skopeo copy --override-os linux --override-arch arm64 "oci-archive:${{ runner.temp }}/image/gyre-image.tar" docker-daemon:gyre:scan-arm64
          fi

      - name: Set up Node.js, pnpm, and Playwright
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26.10.0
          install: false
          cache: true

      - name: Install smoke dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Install pinned Kubernetes smoke tools
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              kind_sha256=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
              kubectl_sha256=629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
              flux_sha256=b853df82adfd7736f580692f9f734473d571606307139f8fd20c2a80dd1ff473
              ;;
            aarch64)
              arch=arm64
              kind_sha256=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
              kubectl_sha256=59f7ee8e477fae658447607dc3c8790ac17a1b016c01c622c12070e969e2d4e7
              flux_sha256=f3e159af616ec0b9bd0a405c2185cf09d06b74652c1de3c7f377e8166826651a
              ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo "$tmpdir/kind" "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-${arch}"
          echo "$kind_sha256  $tmpdir/kind" | sha256sum --check --status
          curl -fsSLo "$tmpdir/kubectl" "https://dl.k8s.io/release/v1.36.1/bin/linux/${arch}/kubectl"
          echo "$kubectl_sha256  $tmpdir/kubectl" | sha256sum --check --status
          curl -fsSLo "$tmpdir/flux.tar.gz" "https://github.com/fluxcd/flux2/releases/download/v2.9.5/flux_2.9.5_linux_${arch}.tar.gz"
          echo "$flux_sha256  $tmpdir/flux.tar.gz" | sha256sum --check --status
          tar -xzf "$tmpdir/flux.tar.gz" -C "$tmpdir" flux
          sudo install -m 0755 "$tmpdir/kind" /usr/local/bin/kind
          sudo install -m 0755 "$tmpdir/kubectl" /usr/local/bin/kubectl
          sudo install -m 0755 "$tmpdir/flux" /usr/local/bin/flux
          kind version
          kubectl version --client
          flux --version

      - name: Verify digest-preserving OCI transport locally
        if: github.event_name == 'workflow_dispatch' && inputs.verification_only == true
        run: |
          set -euo pipefail
          docker run --detach --rm --name gyre-verification-registry --publish 127.0.0.1:5000:5000 registry:2
          cleanup() { docker stop gyre-verification-registry >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:5000/v2/ >/dev/null
          for tag in verification verification-alias; do
            skopeo copy --all --preserve-digests --dest-tls-verify=false "oci-archive:${{ runner.temp }}/image/gyre-image.tar" "docker://127.0.0.1:5000/gyre:${tag}"
            digest="sha256:$(skopeo inspect --raw --tls-verify=false "docker://127.0.0.1:5000/gyre:${tag}" | sha256sum | cut -d' ' -f1)"
            test "$digest" = "${{ needs.build-image.outputs.digest }}"
          done

      - name: Smoke-test scanned amd64 image
        run: pnpm smoke:image --image gyre:scan-amd64 --platform linux/amd64

      - name: Smoke-test scanned arm64 image
        if: contains(needs.build-image.outputs.platforms, 'arm64')
        run: pnpm smoke:image --image gyre:scan-arm64 --platform linux/arm64

      - name: Verification summary
        if: github.event_name == 'workflow_dispatch' && inputs.verification_only == true
        run: |
          echo '## Verification completed successfully' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both architectures passed blocking vulnerability scans, digest-preserving OCI transport verification, and packaged-image smoke tests. No image was published.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: github.event_name != 'pull_request' && inputs.verification_only != true
    needs: [build-image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Download exact original OCI artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-image.outputs.artifact-id }}
          path: ${{ runner.temp }}/image
          digest-mismatch: error

      - name: Install Skopeo
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo

      - name: Reverify original OCI artifact
        env:
          EXPECTED_SHA256: ${{ needs.build-image.outputs.archive-sha256 }}
          EXPECTED_DIGEST: ${{ needs.build-image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "$EXPECTED_SHA256  ${{ runner.temp }}/image/gyre-image.tar" | sha256sum --check --status
          digest="sha256:$(skopeo inspect --raw "oci-archive:${{ runner.temp }}/image/gyre-image.tar" | sha256sum | cut -d' ' -f1)"
          test "$digest" = "$EXPECTED_DIGEST"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact tested OCI image and verify digest
        env:
          IMAGE_TAGS: ${{ needs.build-image.outputs.tags }}
          EXPECTED_DIGEST: ${{ needs.build-image.outputs.digest }}
          EXPECTED_SHA256: ${{ needs.build-image.outputs.archive-sha256 }}
          IMAGE_PREFIX: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:'
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          [[ "$EXPECTED_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ -n "$IMAGE_TAGS" ]]
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            [[ "$image_tag" == "$IMAGE_PREFIX"* ]]
            skopeo copy --all --preserve-digests "oci-archive:${{ runner.temp }}/image/gyre-image.tar" "docker://${image_tag}"
            digest="sha256:$(skopeo inspect --raw "docker://${image_tag}" | sha256sum | cut -d' ' -f1)"
            test "$digest" = "$EXPECTED_DIGEST"
          done <<< "$IMAGE_TAGS"

      - name: Generate registry artifact attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ needs.build-image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Build summary
        env:
          IMAGE_TAGS: ${{ needs.build-image.outputs.tags }}
          IMAGE_DIGEST: ${{ needs.build-image.outputs.digest }}
          IMAGE_PLATFORMS: ${{ needs.build-image.outputs.platforms }}
        run: |
          {
            echo '## Docker Image Published Successfully'
            echo
            echo "- Registry: \`$REGISTRY\`"
            echo "- Repository: \`$IMAGE_NAME\`"
            echo "- Platforms: \`$IMAGE_PLATFORMS\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo
            echo '### Published tags'
            echo '```'
            printf '%s\n' "$IMAGE_TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  report-security:
    if: always() && needs.build-image.result == 'success' && needs.build-image.outputs.sarif-uploaded == 'true'
    needs: [build-image, publish]
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
    steps:
      - name: Download exact SARIF artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build-image.outputs.sarif-artifact-id }}
          path: sarif
          digest-mismatch: error
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: sarif/trivy-results.sarif
          category: container-scan

  report-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && needs.build-image.result == 'success' && needs.smoke.result == 'success'
    needs: [build-image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const output = `### Docker Build Completed

            **Status:** Success
            **Platform:** ${{ needs.build-image.outputs.platforms }}
            **Checks:** Blocking vulnerability scan and packaged-image smoke test passed.

            > Note: Images are not pushed for pull requests. Merge to main to publish.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
