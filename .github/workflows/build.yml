name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'documentation/**'
      - '**.md'
  workflow_dispatch:
    inputs:
      verification_only:
        description: Build, scan, and smoke-test both architectures without publishing
        required: false
        type: boolean
        default: false

# A newer push supersedes an older image build for the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: entropy0120/gyre
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    # Build arm64 natively; QEMU is used for the amd64 target.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract metadata (tags, labels) for Docker
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Latest tag (only on main branch)
            type=raw,value=latest,enable={{is_default_branch}}
            # Branch name (main, develop, etc.)
            type=ref,event=branch
            # Immutable version tag (e.g., 0.5.0)
            type=semver,pattern={{version}}
            # PR tags (for pull requests)
            type=ref,event=pr
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.title=Gyre
            org.opencontainers.image.description=Modern WebUI for FluxCD
            org.opencontainers.image.vendor=Gyre Project
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            org.opencontainers.image.title=Gyre
            org.opencontainers.image.description=Modern WebUI for FluxCD
            org.opencontainers.image.vendor=Gyre Project
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/README.md
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index

      # Build into the local Docker daemon and scan before pushing. Export the
      # full build graph so the later multi-platform publish step can reuse it.
      # Trivy 0.50+ dropped the docker-archive: URI scheme; it resolves image
      # names via the local daemon, so load:true is required. The scan must pass
      # (exit-code: 1) before the push runs.
      - name: Build image for scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: gyre:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy scan (blocking)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: gyre:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: '1'
          trivyignores: .trivyignore

      # Build arm64 natively and scan before pushing so arm64-specific
      # vulnerabilities are caught. This runner is arm64, so no emulation is used.
      - name: Build image for scan (arm64)
        if: github.event_name != 'pull_request' || inputs.verification_only == true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/arm64
          load: true
          tags: gyre:scan-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Run Trivy scan arm64 (blocking)
        if: github.event_name != 'pull_request' || inputs.verification_only == true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: gyre:scan-arm64
          format: table
          severity: CRITICAL
          ignore-unfixed: false
          vuln-type: os,library
          exit-code: '1'
          trivyignores: .trivyignore

      - name: Set up Node.js, pnpm, and Playwright
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          runtime: node@26.10.0
          install: false
          cache: true

      - name: Install smoke dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Install pinned Kubernetes smoke tools
        run: |
          set -euo pipefail
          tmpdir=$(mktemp -d)
          trap 'rm -rf "$tmpdir"' EXIT
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              kind_sha256=aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
              kubectl_sha256=629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
              flux_sha256=b853df82adfd7736f580692f9f734473d571606307139f8fd20c2a80dd1ff473
              ;;
            aarch64)
              arch=arm64
              kind_sha256=20022bee6cfcd5086cb7234d218e3454e6090022f2a8f55d1fa7fcf42c3867a2
              kubectl_sha256=59f7ee8e477fae658447607dc3c8790ac17a1b016c01c622c12070e969e2d4e7
              flux_sha256=f3e159af616ec0b9bd0a405c2185cf09d06b74652c1de3c7f377e8166826651a
              ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -fsSLo "$tmpdir/kind" "https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-${arch}"
          echo "$kind_sha256  $tmpdir/kind" | sha256sum --check --status
          curl -fsSLo "$tmpdir/kubectl" "https://dl.k8s.io/release/v1.36.1/bin/linux/${arch}/kubectl"
          echo "$kubectl_sha256  $tmpdir/kubectl" | sha256sum --check --status
          curl -fsSLo "$tmpdir/flux.tar.gz" "https://github.com/fluxcd/flux2/releases/download/v2.9.5/flux_2.9.5_linux_${arch}.tar.gz"
          echo "$flux_sha256  $tmpdir/flux.tar.gz" | sha256sum --check --status
          tar -xzf "$tmpdir/flux.tar.gz" -C "$tmpdir" flux
          sudo install -m 0755 "$tmpdir/kind" /usr/local/bin/kind
          sudo install -m 0755 "$tmpdir/kubectl" /usr/local/bin/kubectl
          sudo install -m 0755 "$tmpdir/flux" /usr/local/bin/flux
          kind version
          kubectl version --client
          flux --version

      - name: Smoke-test scanned amd64 image
        run: pnpm smoke:image --image gyre:scan --platform linux/amd64

      - name: Smoke-test scanned arm64 image
        if: github.event_name != 'pull_request' || inputs.verification_only == true
        run: pnpm smoke:image --image gyre:scan-arm64 --platform linux/arm64

      # Images are published only after blocking scans and packaged-image smoke tests pass.
      - name: Build and push Docker image
        id: build-and-push
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: |
            type=gha
            type=gha,scope=arm64
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Post-push SARIF scan for GitHub Security tab reporting (non-blocking).
      # exit-code: '0' is intentional — the blocking scan above already enforces
      # security; this step is reporting-only and must not fail the build.
      - name: Run Trivy vulnerability scanner (SARIF)
        id: trivy-sarif
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: false
          vuln-type: os,library
          scanners: vuln,secret,config
          exit-code: '0'
          trivyignores: .trivyignore

      - name: Check SARIF output exists
        id: sarif-check
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        run: |
          if [ -f trivy-results.sarif ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: >-
          github.event_name != 'pull_request' &&
          inputs.verification_only != true &&
          steps.trivy-sarif.outcome == 'success' &&
          steps.sarif-check.outputs.sarif_exists == 'true'
        with:
          sarif_file: trivy-results.sarif
          category: container-scan

      # Generate artifact attestation (supply chain security)
      - name: Generate artifact attestation
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-and-push.outputs.digest }}
          push-to-registry: true

      # Create a detailed build summary
      - name: Build summary
        if: github.event_name != 'pull_request' && inputs.verification_only != true
        env:
          SARIF_OUTCOME: ${{ steps.trivy-sarif.outcome }}
          SARIF_EXISTS: ${{ steps.sarif-check.outputs.sarif_exists }}
        run: |
          echo "## Docker Image Published Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Details" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Registry** | \`${{ env.REGISTRY }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | \`${{ env.IMAGE_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | \`${{ env.PLATFORMS }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build-and-push.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Tags" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "$SARIF_OUTCOME" = "success" ] && [ "$SARIF_EXISTS" = "true" ]; then
            echo "### Security Scan" >> $GITHUB_STEP_SUMMARY
            echo "Trivy vulnerability scan completed. Check the Security tab for detailed results." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Latest version:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Specific version:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Helm Installation" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "helm install gyre charts/gyre \\" >> $GITHUB_STEP_SUMMARY
          echo "  --namespace flux-system \\" >> $GITHUB_STEP_SUMMARY
          echo "  --create-namespace \\" >> $GITHUB_STEP_SUMMARY
          echo "  --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Verification summary
        if: github.event_name == 'workflow_dispatch' && inputs.verification_only == true
        run: |
          echo "## Verification completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "Both architectures passed blocking vulnerability scans and packaged-image smoke tests. No image was published." >> $GITHUB_STEP_SUMMARY

      # Comment on PR with build info (for pull requests)
      - name: Comment on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const output = `### Docker Build Completed

            **Status:** Success
            **Platform:** linux/amd64
            **Checks:** Blocking vulnerability scan and packaged-image smoke test passed.

            ### Security Scan
            Trivy vulnerability scan completed. Check the workflow logs for details.

            > Note: Images are not pushed for pull requests. Merge to main to publish.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
